<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Guess It! — estimate, compare, improve</title>
    <meta name="description" content="Guess It! is a daily estimation game for curious people. Make a guess, see how close you got, and play again tomorrow." />
    <meta name="theme-color" content="#1c1b24" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply stored/system theme before first paint (no flash). Mirrors src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem('guessit-theme');
          if (t !== 'dark' && t !== 'light') {
            t = 'dark';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
